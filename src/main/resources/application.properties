spring.application.name=Enotes_Api_Service

server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/ enotes
spring.datasource.username=root
spring.datasource.password=root

#hibernate
#generate sql queries internally by using dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

#hibernate automatcialy create table or update the existing table
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true 
